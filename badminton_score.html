<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>羽球主審 V15 (震動回饋版)</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root { 
            --color-left: #ff5252; 
            --color-right: #448aff; 
            --bg-dark: #222; 
            --score-size: 150px; 
        }

        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg-dark); color: white; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Header */
        #header { height: 60px; background: #333; display: flex; justify-content: space-between; align-items: center; padding: 0 10px; font-size: 14px; flex-shrink: 0; }
        .header-left { display: flex; align-items: center; gap: 5px; } 
        
        /* 直播開關 */
        .live-switch {
            display: flex; align-items: center; gap: 5px; cursor: pointer;
            padding: 5px 10px; border-radius: 20px; border: 1px solid #555; background: #222;
            transition: all 0.3s;
        }
        .live-switch.active { background: rgba(0, 200, 0, 0.2); border-color: #00ff00; }
        .live-dot { width: 10px; height: 10px; border-radius: 50%; background: #555; transition: all 0.3s; }
        .live-switch.active .live-dot { background: #00ff00; box-shadow: 0 0 5px #00ff00; }
        .live-text { font-size: 12px; color: #aaa; }
        .live-switch.active .live-text { color: #fff; font-weight: bold; }

        .header-input {
            background: #444; border: 1px solid #666; color: white; padding: 5px; border-radius: 4px; text-align: center;
            user-select: none; cursor: pointer;
        }
        .header-input:active { background: #555; }
        
        input[type=text], input[type=number] { background: #444; border: 1px solid #666; color: white; padding: 5px; border-radius: 4px; }

        /* V15 新增：震動開關樣式 */
        .switch-row {
            display: flex; justify-content: space-between; align-items: center;
            background: #333; padding: 10px; border-radius: 5px; border: 1px solid #555; margin-bottom: 15px;
        }
        .toggle-checkbox {
            width: 20px; height: 20px; cursor: pointer;
        }

        /* Modal */
        #live-confirm-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 999;
            display: none; flex-direction: column; align-items: center; justify-content: center;
        }
        .confirm-box { background: #333; padding: 30px; border-radius: 10px; border: 1px solid #666; width: 80%; max-width: 350px; text-align: center; }
        .confirm-input { width: 100%; padding: 12px; margin: 10px 0; font-size: 16px; box-sizing: border-box; background: #222; color: white; border: 1px solid #555; border-radius: 5px; text-align: center; }
        .btn-confirm-live { width: 100%; padding: 12px; background: #00c853; color: white; border: none; font-size: 18px; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        .btn-cancel-live { width: 100%; padding: 10px; background: transparent; color: #aaa; border: none; font-size: 14px; cursor: pointer; margin-top: 5px; text-decoration: underline; }

        /* Court Area */
        #court { flex: 1; display: flex; position: relative; overflow: hidden; }
        .side { 
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; 
            position: relative; cursor: pointer; user-select: none; 
            transition: background-color 0.2s;
        }
        .side.team-a { background-color: var(--color-left); } 
        .side.team-b { background-color: var(--color-right); }
        
        @keyframes click-flash {
            0% { filter: brightness(1.5); }
            100% { filter: brightness(1); }
        }
        .flash-active { animation: click-flash 0.1s ease-out; }

        .score { 
            font-size: var(--score-size); 
            font-weight: bold; 
            line-height: 1; 
            pointer-events: none; 
            transition: font-size 0.2s;
        }
        
        .team-name { 
            font-size: 32px; font-weight: bold; margin-bottom: 5px; text-align: center; 
            pointer-events: auto; z-index: 5;
        }
        
        .server-indicator { font-size: 20px; background: rgba(0,0,0,0.4); padding: 5px 15px; border-radius: 20px; margin-top: 5px; display: none; pointer-events: none; }
        .side.serving .server-indicator { display: block; }
        
        .position-box { 
            position: absolute; bottom: 10px; width: 90%; height: 50px; display: flex; border: 2px solid rgba(255,255,255,0.5); 
            pointer-events: auto; opacity: 0.9; z-index: 5;
        }
        .pos-l, .pos-r { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 12px; background: rgba(0,0,0,0.1); pointer-events: none; }
        .pos-active { background: rgba(255,255,255,0.95); color: #000; font-weight: bold; font-size: 18px; box-shadow: 0 0 15px rgba(255,255,255,0.8); }
        
        #controls-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; display: flex; flex-direction: column; gap: 15px; align-items: center; }
        .btn-ctrl { background: rgba(0,0,0,0.6); color: white; border: 1px solid white; padding: 8px 18px; border-radius: 50px; cursor: pointer; backdrop-filter: blur(5px); font-size: 14px; white-space: nowrap; }
        .btn-end-match { background: rgba(220, 0, 0, 0.9); border: 2px solid #ffaaaa; font-size: 18px; font-weight: bold; padding: 15px 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        
        #settings-panel, #history-panel { position: absolute; top: 60px; left: 0; width: 100%; height: calc(100% - 60px); background: rgba(0,0,0,0.95); z-index: 20; padding: 20px; box-sizing: border-box; display: none; overflow-y: auto; }
        .panel-visible { display: block !important; }
        .full-width { width: 100%; box-sizing: border-box; font-size: 16px; padding: 10px; margin-bottom: 10px; }
        .row { margin-bottom: 15px; } label { display: block; color: #aaa; margin-bottom: 5px; }

        .log-item { background: #333; margin-bottom: 10px; padding: 10px; border-radius: 5px; border: 1px solid #555; display: flex; justify-content: space-between; align-items: center; }
        .log-info { font-size: 14px; color: #ddd; }
        .log-status { font-size: 12px; margin-left: 10px; padding: 3px 8px; border-radius: 4px; }
        .status-pending { background: #555; color: #ccc; }
        .status-sending { background: #ff9800; color: #000; }
        .status-done { background: #4caf50; color: #fff; }
        .status-error { background: #f44336; color: #fff; }
        
        input[type=range] { width: 100%; margin: 10px 0; }
    </style>
</head>
<body>

    <div id="live-confirm-modal">
        <div class="confirm-box">
            <h2 style="color:#00e676; margin-top:0;">📡 開啟直播設定</h2>
            <p style="color:#ccc; font-size:14px;">請確認場地與主審資訊</p>
            <label style="text-align:left; display:block; font-size:12px; color:#aaa;">場地編號</label>
            <input type="number" id="modal-court-input" class="confirm-input" placeholder="例如: 1">
            <label style="text-align:left; display:block; font-size:12px; color:#aaa;">主審姓名</label>
            <input type="text" id="modal-umpire-input" class="confirm-input" placeholder="主審姓名">
            <button class="btn-confirm-live" onclick="confirmGoLive()">確認並上線</button>
            <button class="btn-cancel-live" onclick="cancelLive()">取消</button>
        </div>
    </div>

    <div id="header">
        <div class="header-left">
            <button class="btn-ctrl" onclick="confirmReset()" style="font-size:12px;">↺ 重置</button>
            <input type="text" id="umpireName" class="header-input" placeholder="主審" style="width:50px;" readonly> 
            <input type="number" id="courtNum" class="header-input" value="1" placeholder="場" style="width:30px;" readonly>
        </div>
        <div style="display:flex; align-items:center; gap: 10px;">
            <div class="live-switch" id="liveToggle" onclick="handleLiveClick()">
                <div class="live-dot"></div>
                <div class="live-text" id="liveText">離線</div>
            </div>
            <span id="match-counter" style="color:yellow; font-weight:bold;">G1</span>
            <button class="btn-ctrl" onclick="toggleSettings()">⚙</button>
            <button class="btn-ctrl" onclick="toggleHistory()">📝</button>
        </div>
    </div>

    <div id="court">
        <div id="area-left" class="side team-a">
            <div class="team-name" id="name-box-left">Team A</div>
            <div class="score" id="disp-score-left">0</div>
            <div class="server-indicator">發球</div>
            <div class="position-box" id="pos-box-left">
                <div class="pos-l" id="pos-l-left">奇(左)</div>
                <div class="pos-r" id="pos-r-left">偶(右)</div>
            </div>
        </div>
        <div id="area-right" class="side team-b">
            <div class="team-name" id="name-box-right">Team B</div>
            <div class="score" id="disp-score-right">0</div>
            <div class="server-indicator">發球</div>
            <div class="position-box" id="pos-box-right">
                <div class="pos-l" id="pos-l-right">奇(左)</div>
                <div class="pos-r" id="pos-r-right">偶(右)</div>
            </div>
        </div>
        <div id="controls-overlay">
            <button class="btn-ctrl" onclick="event.stopPropagation(); undoPoint()">↩ 復原</button>
            <button class="btn-ctrl" onclick="event.stopPropagation(); swapSidesManual()">⇄ 換邊</button>
            <button class="btn-ctrl btn-end-match" onclick="event.stopPropagation(); endMatchAndNext()">🏁 比賽結束<br><span style="font-size:12px; font-weight:normal;">(紀錄並下一場)</span></button>
        </div>
    </div>

    <!-- 設定面板 -->
    <div id="settings-panel">
        <h3>比賽設定</h3>
        
        <!-- V15 新增：震動開關 -->
        <div class="switch-row">
            <label style="color:white; font-weight:bold; margin:0;">📳 震動回饋</label>
            <input type="checkbox" id="vibrationToggle" class="toggle-checkbox" checked onchange="toggleVibration(this.checked)">
        </div>

        <div class="row" style="background:#333; padding:10px; border-radius:5px; border:1px solid #555;">
            <label style="color:#ffeb3b; font-weight:bold;">🔠 分數大小: <span id="size-val">150</span>px</label>
            <input type="range" min="100" max="300" value="150" oninput="changeScoreSize(this.value)">
        </div>
        
        <div class="row"><label>Google Form 預填連結</label><input id="gform_link" class="full-width" placeholder="貼上連結..."></div>
        <div class="row"><label>A隊名單 (;分場次)</label><input id="teamA_name" class="full-width" value="紅隊;紅二隊" onchange="render()"></div>
        <div class="row"><label>A隊員 (,分隔)</label><input id="teamA_players" class="full-width" value="王,李;陳,林"></div>
        <div class="row"><label>B隊名單 (;分場次)</label><input id="teamB_name" class="full-width" value="藍隊;藍二隊" onchange="render()"></div>
        <div class="row"><label>B隊員 (,分隔)</label><input id="teamB_players" class="full-width" value="張,林;趙,錢"></div>
        <div class="row"><label>換邊分數</label><input id="swapPoints" class="full-width" value="11"></div>
        <div class="row"><label>發球方</label><select id="initServer" class="full-width" onchange="resetGame()"><option value="A">A隊先發</option><option value="B">B隊先發</option></select></div>
        <div style="display:flex; gap:10px;">
            <button class="btn-ctrl" style="flex:1; background:green;" onclick="toggleSettings()">關閉</button>
        </div>
    </div>
    
    <!-- 歷史紀錄 -->
    <div id="history-panel">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <h3>歷史紀錄</h3>
            <button class="btn-ctrl" style="background:#009688;" onclick="uploadAllPending()">☁ 一鍵全部上傳</button>
        </div>
        <div id="log-container"></div>
        <button class="btn-ctrl" onclick="toggleHistory()" style="margin-top:20px;">關閉</button>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyAq-sTArXeGDVpdjnbLEzh5WpQ5mkmsyoA",
          authDomain: "badminton-live-6237e.firebaseapp.com",
          databaseURL: "https://badminton-live-6237e-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "badminton-live-6237e",
          storageBucket: "badminton-live-6237e.firebasestorage.app",
          messagingSenderId: "414631038880",
          appId: "1:414631038880:web:acd4ad9ebcda0c4598dec5",
          measurementId: "G-2K7HYBBMXX"
        };

        let db; let isLive = false;
        try { firebase.initializeApp(firebaseConfig); db = firebase.database(); } 
        catch (e) { console.error("Firebase Error:", e); }

        let currentMatchIdx = 0;
        let state = { leftTeam: 'A', scoreA: 0, scoreB: 0, serverTeam: 'A', serverIdxA: 0, serverIdxB: 0, swappedPoints: [] };
        let historyStack = []; let pendingRecords = []; 
        
        // V15: 震動變數
        let isVibrationEnabled = true;

        const getEl = (id) => document.getElementById(id);

        window.addEventListener('load', () => {
            setupLongPress(getEl('name-box-left'), () => editTeamName('left'));
            setupLongPress(getEl('name-box-right'), () => editTeamName('right'));
            setupLongPress(getEl('pos-box-left'), () => editPlayerName('left'));
            setupLongPress(getEl('pos-box-right'), () => editPlayerName('right'));
            setupLongPress(getEl('umpireName'), editUmpireName);
            setupLongPress(getEl('courtNum'), editCourtNum);

            bindClickPoint('area-left', 'left');
            bindClickPoint('area-right', 'right');
            
            render();
        });

        // V15: 震動控制函式
        function toggleVibration(checked) {
            isVibrationEnabled = checked;
            if(checked) doVibrate(50); // 測試震動
        }
        function doVibrate(ms) {
            if(isVibrationEnabled && navigator.vibrate) navigator.vibrate(ms);
        }

        function bindClickPoint(elemId, side) {
            const el = getEl(elemId);
            el.addEventListener('click', (e) => {
                if (e.target.closest('.btn-ctrl') || e.target.closest('#controls-overlay')) return;
                
                if (el.dataset.longPressHandled === "true") {
                    el.dataset.longPressHandled = "false";
                    return;
                }

                // V15: 觸發點擊震動 (短震動)
                doVibrate(30);

                addPoint(side);
                
                el.classList.remove('flash-active');
                void el.offsetWidth;
                el.classList.add('flash-active');
            });
        }

        function setupLongPress(element, callback) {
            let timer;
            const duration = 600;
            
            const start = () => {
                timer = setTimeout(() => {
                    // V15: 觸發長按震動 (長一點)
                    doVibrate(50);
                    
                    const parentArea = element.closest('.side');
                    if(parentArea) parentArea.dataset.longPressHandled = "true";
                    
                    callback();
                }, duration);
            };
            const cancel = () => { clearTimeout(timer); };

            element.addEventListener('mousedown', start);
            element.addEventListener('touchstart', start, {passive: true});
            element.addEventListener('mouseup', cancel);
            element.addEventListener('touchend', cancel);
            element.addEventListener('touchcancel', cancel);
            element.addEventListener('mouseleave', cancel);
        }

        // Edit Functions
        function editUmpireName() {
            let val = prompt("修改主審姓名:", getEl('umpireName').value);
            if(val !== null) { getEl('umpireName').value = val; syncToFirebase(); }
        }
        function editCourtNum() {
            let val = prompt("修改場地編號:", getEl('courtNum').value);
            if(val && val !== getEl('courtNum').value) { getEl('courtNum').value = val; syncToFirebase(); }
        }
        function editTeamName(side) {
            let key = (side === 'left') ? state.leftTeam : (state.leftTeam === 'A' ? 'B' : 'A');
            let val = prompt(`修改 ${key} 隊名稱:`, getTeamName(key));
            if (val) { updateInputSegment(`team${key}_name`, val); render(); }
        }
        function editPlayerName(side) {
            let key = (side === 'left') ? state.leftTeam : (state.leftTeam === 'A' ? 'B' : 'A');
            let idx = (key === 'A') ? state.serverIdxA : state.serverIdxB;
            let val = prompt(`修改球員:`, getPlayerName(key, idx));
            if (val) { updatePlayerInput(`team${key}_players`, idx, val); render(); }
        }

        // Logic
        function addPoint(side) {
            saveState();
            let team = (side === 'left') ? state.leftTeam : (state.leftTeam === 'A' ? 'B' : 'A');
            if (team === 'A') state.scoreA++; else state.scoreB++;
            if (team !== state.serverTeam) {
                state.serverTeam = team;
                if (team === 'A') state.serverIdxA = getNextIdx('A', state.serverIdxA); else state.serverIdxB = getNextIdx('B', state.serverIdxB);
            }
            checkSwap(); render();
        }

        function updateInputSegment(id, newVal) {
            let input = getEl(id);
            let parts = input.value.split(/[;；]/);
            let safeIdx = Math.min(currentMatchIdx, parts.length - 1);
            parts[safeIdx] = newVal;
            input.value = parts.join(' ; ');
        }
        function updatePlayerInput(id, pIdx, newVal) {
            let input = getEl(id);
            let mParts = input.value.split(/[;；]/);
            let mIdx = Math.min(currentMatchIdx, mParts.length - 1);
            let players = mParts[mIdx].split(/[,，]/);
            players[pIdx % players.length] = newVal;
            mParts[mIdx] = players.join(',');
            input.value = mParts.join(' ; ');
        }

        function getSegmentedData(id, idx) { let val = getEl(id).value.split(/[;；]/); return val[Math.min(idx, val.length-1)]?.trim() || ""; }
        function getTeamName(k) { return getSegmentedData(`team${k}_name`, currentMatchIdx) || `隊${k}`; }
        function getPlayerName(k, i) { let arr = getSegmentedData(`team${k}_players`, currentMatchIdx).split(/[,，]/); return arr.length ? arr[i % arr.length].trim() : ""; }
        function getNextIdx(k, i) { let len = getSegmentedData(`team${k}_players`, currentMatchIdx).split(/[,，]/).length || 1; return (i + 1) % len; }

        function undoPoint() { if (historyStack.length) { state = historyStack.pop(); render(); } }
        function saveState() { let copy = JSON.parse(JSON.stringify(state)); historyStack.push(copy); if(historyStack.length>50) historyStack.shift(); }
        function checkSwap() {
            let max = Math.max(state.scoreA, state.scoreB);
            let pts = getEl('swapPoints').value.split(',').map(Number);
            if (pts.includes(max) && !state.swappedPoints.includes(max)) {
                state.swappedPoints.push(max); 
                if(confirm(`分數 ${state.scoreA}:${state.scoreB} 換邊？`)) { state.leftTeam = (state.leftTeam==='A')?'B':'A'; }
            }
        }
        function swapSidesManual() { if(confirm("手動換邊？")) { state.leftTeam = (state.leftTeam==='A')?'B':'A'; render(); } }
        function resetGame() { state = { leftTeam: 'A', scoreA: 0, scoreB: 0, serverTeam: getEl('initServer').value, serverIdxA: 0, serverIdxB: 0, swappedPoints: [] }; historyStack = []; render(); }
        function confirmReset() { if(confirm("⚠️ 確定歸零？")) resetGame(); }
        function endMatchAndNext() {
            if (!confirm(`🏁 結束第 ${currentMatchIdx+1} 場，並進入下一場？`)) return;
            logGame(); currentMatchIdx++; resetGame();
            alert(`✅ 已紀錄！進入第 ${currentMatchIdx + 1} 場`);
        }

        function render() {
            let isA_Left = (state.leftTeam === 'A');
            getEl('name-box-left').innerText = getTeamName(isA_Left?'A':'B');
            getEl('name-box-right').innerText = getTeamName(isA_Left?'B':'A');
            getEl('disp-score-left').innerText = isA_Left ? state.scoreA : state.scoreB;
            getEl('disp-score-right').innerText = isA_Left ? state.scoreB : state.scoreA;
            getEl('match-counter').innerText = `G${currentMatchIdx+1}`;
            
            getEl('area-left').className = isA_Left ? "side team-a" : "side team-b"; 
            getEl('area-right').className = isA_Left ? "side team-b" : "side team-a";
            
            getEl('area-left').classList.remove('serving'); getEl('area-right').classList.remove('serving');
            if (state.serverTeam === state.leftTeam) getEl('area-left').classList.add('serving'); else getEl('area-right').classList.add('serving');

            ['pos-l-left','pos-r-left','pos-l-right','pos-r-right'].forEach(id=>getEl(id).classList.remove('pos-active'));
            let score = (state.serverTeam==='A')?state.scoreA:state.scoreB;
            let sName = getPlayerName(state.serverTeam, state.serverTeam==='A'?state.serverIdxA:state.serverIdxB);
            
            let targetId = (state.serverTeam === state.leftTeam) 
                ? (score % 2 == 0 ? 'pos-r-left' : 'pos-l-left')
                : (score % 2 == 0 ? 'pos-r-right' : 'pos-l-right');
            let targetDiv = getEl(targetId);
            if(targetDiv) { targetDiv.classList.add('pos-active'); targetDiv.innerText = sName; }

            syncToFirebase();
        }

        function changeScoreSize(val) { document.documentElement.style.setProperty('--score-size', val + 'px'); getEl('size-val').innerText = val; }
        function handleLiveClick() {
            if (isLive) { isLive = false; updateLiveUI(); } 
            else {
                getEl('modal-court-input').value = getEl('courtNum').value;
                getEl('modal-umpire-input').value = getEl('umpireName').value;
                getEl('live-confirm-modal').style.display = 'flex';
            }
        }
        function confirmGoLive() {
            const cVal = getEl('modal-court-input').value;
            if (!cVal) { alert("⚠️ 必須輸入場地編號！"); return; }
            getEl('courtNum').value = cVal;
            getEl('umpireName').value = getEl('modal-umpire-input').value;
            isLive = true; updateLiveUI();
            getEl('live-confirm-modal').style.display = 'none';
            syncToFirebase();
        }
        function cancelLive() { getEl('live-confirm-modal').style.display = 'none'; }
        function updateLiveUI() {
            const el = getEl('liveToggle'); const txt = getEl('liveText');
            if (isLive) { el.classList.add('active'); txt.innerText = "直播中"; } 
            else { el.classList.remove('active'); txt.innerText = "離線"; }
        }
        function syncToFirebase() {
            if (!isLive || !db) return;
            const courtNum = getEl('courtNum').value; if(!courtNum) return;
            db.ref('courts/court_' + courtNum).set({
                court: courtNum, match: `G${currentMatchIdx+1}`, umpire: getEl('umpireName').value,
                teamA: getTeamName('A'), teamB: getTeamName('B'), scoreA: state.scoreA, scoreB: state.scoreB,
                server: getPlayerName(state.serverTeam, state.serverTeam==='A'?state.serverIdxA:state.serverIdxB),
                serverTeam: state.serverTeam, timestamp: Date.now()
            });
        }

        function logGame() {
            const record = {
                id: Date.now(), court: getEl('courtNum').value || "練習", umpire: getEl('umpireName').value || "-",
                tA: getTeamName('A'), tB: getTeamName('B'), sA: state.scoreA, sB: state.scoreB, winner: state.scoreA > state.scoreB ? getTeamName('A') : getTeamName('B'),
                matchStr: `G${currentMatchIdx+1}`, status: 'pending'
            };
            pendingRecords.push(record); renderLogItem(record);
        }
        function renderLogItem(r) {
            let div = document.createElement('div'); div.className = 'log-item'; div.id = `log-${r.id}`;
            div.innerHTML = `<div class="log-info"><b>${r.matchStr} (場${r.court})</b><br>${r.tA} ${r.sA}:${r.sB} ${r.tB}<br>勝: ${r.winner}</div><div class="log-status status-pending" id="status-${r.id}">待傳送</div>`;
            getEl('log-container').prepend(div);
        }
        function parseLinkAndGetIDs(link) {
            if (!link.includes('docs.google.com')) return null;
            const baseUrl = link.split('?')[0].replace('viewform', 'formResponse');
            const params = new URLSearchParams(link.split('?')[1]);
            const mapping = {};
            const keys = { '__COURT__': 'court', '__UMPIRE__': 'umpire', '__TEAMA__': 'tA', '__TEAMB__': 'tB', '__SCOREA__': 'sA', '__SCOREB__': 'sB', '__WINNER__': 'winner' };
            params.forEach((value, key) => { if (keys[value]) mapping[keys[value]] = key; });
            return { baseUrl, mapping };
        }
        async function uploadAllPending() {
            const link = getEl('gform_link').value;
            if (!link) return alert("請先貼上 Google Form 連結！");
            const config = parseLinkAndGetIDs(link);
            if (!config || Object.keys(config.mapping).length < 7) return alert("連結格式錯誤！");
            const targets = pendingRecords.filter(r => r.status === 'pending');
            if (targets.length === 0) return alert("沒有待傳送的紀錄。");
            if (!confirm(`上傳 ${targets.length} 筆資料？`)) return;

            for (let r of targets) {
                updateStatus(r.id, 'sending', '傳送中...');
                const formData = new FormData();
                formData.append(config.mapping.court, r.court); formData.append(config.mapping.umpire, r.umpire);
                formData.append(config.mapping.tA, r.tA); formData.append(config.mapping.tB, r.tB);
                formData.append(config.mapping.sA, r.sA); formData.append(config.mapping.sB, r.sB);
                formData.append(config.mapping.winner, r.winner);
                try {
                    await fetch(config.baseUrl, { method: 'POST', mode: 'no-cors', body: formData });
                    r.status = 'done'; updateStatus(r.id, 'done', '✅ 已上傳');
                } catch (e) {
                    r.status = 'error'; updateStatus(r.id, 'error', '❌ 失敗');
                }
                await new Promise(res => setTimeout(res, 500));
            }
            alert("上傳作業結束。");
        }
        function updateStatus(id, type, text) { const el = getEl(`status-${id}`); if (el) { el.className = `log-status status-${type}`; el.innerText = text; } }
        function toggleSettings() { getEl('settings-panel').classList.toggle('panel-visible'); }
        function toggleHistory() { getEl('history-panel').classList.toggle('panel-visible'); }
    </script>
</body>
</html>
