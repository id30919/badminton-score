<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>羽球賽事即時看板</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background: #1a1a1a; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #ffeb3b; margin-top: 0; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; }
        
        /* 網格佈局 */
        #grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .court-card {
            background: #333;
            border-radius: 12px;
            padding: 15px;
            border: 2px solid #444;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.2s;
        }
        
        /* 標頭：場地與賽事 */
        .card-header { 
            display: flex; justify-content: space-between; align-items: center;
            font-size: 16px; color: #ccc; margin-bottom: 15px; 
            border-bottom: 1px solid #555; padding-bottom: 8px; 
        }
        .court-badge { background: #555; padding: 2px 8px; border-radius: 4px; color: white; font-weight: bold; }
        .match-info { color: #00e676; font-weight: bold; }

        /* 比分區域 */
        .teams-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .team-box { flex: 1; text-align: center; overflow: hidden; }
        
        .t-name { 
            font-size: 22px; font-weight: bold; margin-bottom: 5px; 
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
            padding: 0 5px;
        }
        .t-score { font-size: 60px; font-weight: bold; line-height: 1; text-shadow: 2px 2px 5px rgba(0,0,0,0.5); }
        
        /* === 修改處：配色改為橘/藍 === */
        .color-a { color: #ff9800; } /* 鮮豔橘 */
        .color-b { color: #00b0ff; } /* 天藍色 */
        
        .vs { font-size: 14px; color: #666; margin: 0 10px; font-weight: bold; }

        /* 底部資訊：發球與主審 */
        .footer-info { 
            font-size: 14px; text-align: center; margin-top: 10px; 
            background: rgba(0,0,0,0.3); padding: 8px; border-radius: 5px; color: #ddd;
            display: flex; justify-content: space-between;
        }
        
        .server-dot { 
            display: inline-block; width: 10px; height: 10px; 
            background: #ffeb3b; border-radius: 50%; margin-right: 5px; 
            animation: blink 1s infinite; 
        }
        
        @keyframes blink { 50% { opacity: 0.3; } }
        
        .no-data { text-align:center; grid-column: 1/-1; color:#666; margin-top: 50px; font-size: 18px; }
    </style>
</head>
<body>

    <h1>🏸 Live Scores</h1>
    <div id="grid-container">
        <div class="no-data">連線中... / 等待比賽開始</div>
    </div>

    <script>
        // ============== 你的 Firebase 設定 ==============
        const firebaseConfig = {
          apiKey: "AIzaSyAq-sTArXeGDVpdjnbLEzh5WpQ5mkmsyoA",
          authDomain: "badminton-live-6237e.firebaseapp.com",
          databaseURL: "https://badminton-live-6237e-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "badminton-live-6237e",
          storageBucket: "badminton-live-6237e.firebasestorage.app",
          messagingSenderId: "414631038880",
          appId: "1:414631038880:web:acd4ad9ebcda0c4598dec5",
          measurementId: "G-2K7HYBBMXX"
        };

        try {
            firebase.initializeApp(firebaseConfig);
            const db = firebase.database();
            const container = document.getElementById('grid-container');

            // 監聽所有場地資料變化
            db.ref('courts').on('value', (snapshot) => {
                const data = snapshot.val();
                container.innerHTML = ""; // 清空舊資料
                
                if (!data) {
                    container.innerHTML = "<div class='no-data'>目前沒有進行中的比賽</div>";
                    return;
                }

                // 將資料轉為陣列並排序 (依照 court 編號 1, 2, 3...)
                const matches = Object.keys(data).map(key => data[key]);
                matches.sort((a, b) => parseInt(a.court) - parseInt(b.court));

                matches.forEach(m => {
                    const card = createCard(m);
                    container.appendChild(card);
                });
            });
        } catch(e) {
            console.error("Firebase Error", e);
            document.getElementById('grid-container').innerHTML = "<div class='no-data' style='color:red'>連線失敗，請檢查設定</div>";
        }

        function createCard(m) {
            // 處理發球者顯示
            // 注意：這裡也要對應橘色/藍色的邏輯
            const serverColor = m.serverTeam === 'A' ? '#ffb74d' : '#80d8ff'; // 發球者名字顏色稍微亮一點，比較好讀
            
            const serverHTML = m.server 
                ? `<span style="color:${serverColor}">🎾 ${m.server}</span>` 
                : '<span>-</span>';
            
            const div = document.createElement('div');
            div.className = 'court-card';
            div.innerHTML = `
                <div class="card-header">
                    <span class="court-badge">場地 ${m.court}</span>
                    <span class="match-info">${m.match}</span>
                </div>
                <div class="teams-row">
                    <div class="team-box">
                        <div class="t-name color-a">${m.teamA}</div>
                        <div class="t-score color-a">${m.scoreA}</div>
                    </div>
                    <div class="vs">VS</div>
                    <div class="team-box">
                        <div class="t-name color-b">${m.teamB}</div>
                        <div class="t-score color-b">${m.scoreB}</div>
                    </div>
                </div>
                <div class="footer-info">
                    <div>${serverHTML}</div>
                    <div style="color:#888;">主審: ${m.umpire || '-'}</div>
                </div>
            `;
            return div;
        }
    </script>
</body>
</html>
