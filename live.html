<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>羽球賽事直播 & 中控台</title>
    
    <!-- 直播端專用圖示 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📡</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23333%22/><text x=%2250%22 y=%2255%22 font-size=%2270%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22>📡</text></svg>">
    <meta name="apple-mobile-web-app-title" content="賽事直播">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background: #1a1a1a; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; position: relative; }
        
        /* Header Layout */
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #444; padding-bottom: 10px; }
        h1 { margin: 0; color: #ffeb3b; text-transform: uppercase; letter-spacing: 2px; font-size: 24px; }
        
        /* Toggle Switch for Admin Mode */
        .admin-toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; background: #333; padding: 5px 12px; border-radius: 20px; border: 1px solid #555; transition: 0.3s; user-select: none; }
        .admin-toggle:hover { background: #444; }
        .toggle-dot { width: 10px; height: 10px; border-radius: 50%; background: #555; transition: 0.3s; }
        .toggle-text { font-size: 14px; color: #aaa; font-weight: bold; }
        
        /* Active Admin State */
        .admin-toggle.active { border-color: #f44336; background: rgba(244, 67, 54, 0.1); }
        .admin-toggle.active .toggle-dot { background: #f44336; box-shadow: 0 0 8px #f44336; }
        .admin-toggle.active .toggle-text { color: #fff; }

        /* Grid */
        #grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .court-card {
            background: #333;
            border-radius: 12px;
            padding: 15px;
            border: 2px solid #444;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.2s, border-color 0.3s;
        }
        
        .card-header { 
            display: flex; justify-content: space-between; align-items: center;
            font-size: 16px; color: #ccc; margin-bottom: 15px; 
            border-bottom: 1px solid #555; padding-bottom: 8px; 
        }
        .court-badge { background: #555; padding: 2px 8px; border-radius: 4px; color: white; font-weight: bold; }
        .match-info { color: #00e676; font-weight: bold; }

        .teams-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .team-box { flex: 1; text-align: center; overflow: hidden; display: flex; flex-direction: column; align-items: center; }
        
        .t-name { 
            font-size: 22px; font-weight: bold; margin-bottom: 5px; 
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
            padding: 0 5px; width: 100%;
        }
        .t-score { font-size: 60px; font-weight: bold; line-height: 1; text-shadow: 2px 2px 5px rgba(0,0,0,0.5); margin-bottom: 5px; }
        
        .t-players {
            font-size: 14px; color: #aaa; line-height: 1.4;
            background: rgba(0,0,0,0.2); padding: 4px 8px; border-radius: 4px;
            max-width: 90%; word-wrap: break-word; min-height: 20px;
        }

        .color-a { color: #ff9800; } 
        .color-b { color: #00b0ff; } 
        .vs { font-size: 14px; color: #666; margin: 15px 10px 0; font-weight: bold; }

        .footer-info { 
            font-size: 14px; text-align: center; margin-top: 10px; 
            background: rgba(0,0,0,0.3); padding: 8px; border-radius: 5px; color: #888;
        }
        
        .server-icon { font-size: 16px; margin-left: 5px; }
        
        .no-data { text-align:center; grid-column: 1/-1; color:#666; margin-top: 50px; font-size: 18px; }

        /* === Delete Button (Hidden by default) === */
        .btn-delete {
            position: absolute; top: -10px; right: -10px;
            background: #d32f2f; color: white; border: 2px solid white;
            width: 30px; height: 30px; border-radius: 50%;
            font-weight: bold; cursor: pointer; z-index: 10;
            display: none; align-items: center; justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            font-family: Arial, sans-serif;
        }
        .btn-delete:hover { background: #b71c1c; transform: scale(1.1); }
        
        /* When Admin Mode is ON */
        body.admin-mode .btn-delete { display: flex; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        body.admin-mode .court-card { border-color: #d32f2f; }
        
        @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }
    </style>
</head>
<body>

    <div class="header-bar">
        <h1>🏸 Live Scores</h1>
        <div class="admin-toggle" id="adminToggle" onclick="toggleAdmin()">
            <div class="toggle-dot"></div>
            <div class="toggle-text">管理模式</div>
        </div>
    </div>

    <div id="grid-container">
        <div class="no-data">連線中... / 等待比賽開始</div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyAq-sTArXeGDVpdjnbLEzh5WpQ5mkmsyoA",
          authDomain: "badminton-live-6237e.firebaseapp.com",
          databaseURL: "https://badminton-live-6237e-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "badminton-live-6237e",
          storageBucket: "badminton-live-6237e.firebasestorage.app",
          messagingSenderId: "414631038880",
          appId: "1:414631038880:web:acd4ad9ebcda0c4598dec5",
          measurementId: "G-2K7HYBBMXX"
        };

        let db;
        let isAdminMode = false;

        function toggleAdmin() {
            isAdminMode = !isAdminMode;
            const toggleBtn = document.getElementById('adminToggle');
            if (isAdminMode) {
                document.body.classList.add('admin-mode');
                toggleBtn.classList.add('active');
            } else {
                document.body.classList.remove('admin-mode');
                toggleBtn.classList.remove('active');
            }
        }

        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            const container = document.getElementById('grid-container');

            db.ref('courts').on('value', (snapshot) => {
                const data = snapshot.val();
                container.innerHTML = ""; 
                
                if (!data) {
                    container.innerHTML = "<div class='no-data'>目前沒有進行中的比賽</div>";
                    return;
                }

                // Convert object to array and keep the DB Key
                const matches = Object.keys(data).map(key => {
                    return { dbKey: key, ...data[key] };
                });

                // Filter stale matches (older than 12 hours)
                const now = Date.now();
                const activeMatches = matches.filter(m => (now - m.timestamp) < 43200000); 

                if (activeMatches.length === 0) {
                    container.innerHTML = "<div class='no-data'>目前沒有進行中的比賽</div>";
                    return;
                }

                // Sort by court number
                activeMatches.sort((a, b) => parseInt(a.court) - parseInt(b.court));

                activeMatches.forEach(m => {
                    const card = createCard(m);
                    container.appendChild(card);
                });
            });
        } catch(e) {
            console.error("Firebase Error", e);
            document.getElementById('grid-container').innerHTML = "<div class='no-data' style='color:red'>連線失敗，請檢查設定</div>";
        }

        function createCard(m) {
            const iconA = m.serverTeam === 'A' ? '<span class="server-icon">🏸</span>' : '';
            const iconB = m.serverTeam === 'B' ? '<span class="server-icon">🏸</span>' : '';

            const div = document.createElement('div');
            div.className = 'court-card';
            div.innerHTML = `
                <button class="btn-delete" onclick="forceRemove('${m.dbKey}', '${m.court}')" title="強制下架">X</button>
                <div class="card-header">
                    <span class="court-badge">場地 ${m.court}</span>
                    <span class="match-info">${m.match}</span>
                </div>
                <div class="teams-row">
                    <div class="team-box">
                        <div class="t-name color-a">${m.teamA} ${iconA}</div>
                        <div class="t-score color-a">${m.scoreA}</div>
                        <div class="t-players">${m.playersA || ''}</div>
                    </div>
                    <div class="vs">VS</div>
                    <div class="team-box">
                        <div class="t-name color-b">${m.teamB} ${iconB}</div>
                        <div class="t-score color-b">${m.scoreB}</div>
                        <div class="t-players">${m.playersB || ''}</div>
                    </div>
                </div>
                <div class="footer-info">
                    主審: ${m.umpire || '-'}
                </div>
            `;
            return div;
        }

        // Global function for admin deletion
        window.forceRemove = function(dbKey, courtNum) {
            if(confirm(`⚠️ 確定要強制刪除【場地 ${courtNum}】的資料嗎？\n這會讓所有觀眾畫面上的此場地消失。`)) {
                db.ref('courts/' + dbKey).remove()
                    .then(() => {
                        // Optional: Show toast or alert
                    })
                    .catch(err => alert("刪除失敗: " + err));
            }
        }
    </script>
</body>
</html>
